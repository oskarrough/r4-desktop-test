[package]
name = "radio4000"
version = "0.1.0"
edition = "2024"

[dependencies]
libmpv2 = { version = "6.0.0", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11"] }
egui = "0.36.2"
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
egui_extras = { version = "0.36.2", features = ["svg"] }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.14.0", version = "0.14.0" }
