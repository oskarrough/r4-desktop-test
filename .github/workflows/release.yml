name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel on main: a half-finished release would mix assets from two commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Drafts are work in progress; build once marked ready.
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: radio4000-linux-x86_64.tar.gz
          - os: macos-latest
            asset: radio4000-macos-arm64.tar.gz
          - os: windows-latest
            asset: radio4000-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs can only read main's cache, so their saves just crowd it out.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install libmpv (Linux)
        if: runner.os == 'Linux'
        run: |
          # Skip rebuilding the man page index after install; it's most of the wait.
          echo 'set man-db/auto-update false' | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv-dev

      - name: Install libmpv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*.7z' --output mpv-dev.7z
          7z x mpv-dev.7z -ompv-dev
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $bin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\lib.exe" | Select-Object -First 1).DirectoryName
          # Newer builds ship no mpv.def, so list the DLL's exports ourselves.
          $exports = & "$bin\dumpbin.exe" /exports mpv-dev\libmpv-2.dll | Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $exports) { throw 'no exports found in libmpv-2.dll' }
          # LIBRARY names the DLL the exe will load; without it lib.exe assumes mpv.dll.
          @('LIBRARY libmpv-2.dll', 'EXPORTS') + $exports | Set-Content mpv-dev\mpv.def
          & "$bin\lib.exe" /def:mpv-dev\mpv.def /machine:x64 /out:mpv-dev\mpv.lib
          "LIB=$env:LIB;$PWD\mpv-dev" >> $env:GITHUB_ENV

      # Read by `radio4000 --version`; a real tag goes here once releases are tagged.
      - name: Set the version
        shell: bash
        run: echo "RADIO4000_VERSION=latest-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - run: cargo build --release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset }} -C target/release radio4000

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target\release\radio4000.exe, mpv-dev\libmpv-2.dll -DestinationPath ${{ matrix.asset }}

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Run the exe from the unpacked zip with --version: a missing DLL fails before main.
          Expand-Archive ${{ matrix.asset }} -DestinationPath smoke
          & smoke\radio4000.exe --version
          if ($LASTEXITCODE -ne 0) { throw "radio4000.exe --version exited $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksum the assets
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Update the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Update in place so the download URLs never 404 mid-release.
          notes="Built from $GITHUB_SHA on every push to main."
          if gh release view latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            gh release upload latest dist/* --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Latest build" --notes "$notes"
          fi
